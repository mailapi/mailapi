name: Auto assign

on:
  pull_request_target:
    types:
      - opened
      - reopened

# This workflow runs on `pull_request_target`, so it deliberately does not check
# out the pull request, and only calls the issues API.
permissions:
  contents: read
  issues: write

jobs:
  assign-author:
    name: Auto assign
    runs-on: ubuntu-latest
    steps:
      - name: Assign jmnote
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_ASSIGN_TOKEN }}
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: ['jmnote']
            });
