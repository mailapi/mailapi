name: Release

on:
  push:
    branches:
      - main
    paths:
      - openapi.yaml

permissions:
  contents: write

jobs:
  release:
    name: Create release and publish documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate OpenAPI version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '
            /^info:[[:space:]]*$/ { in_info=1; next }
            in_info && /^[^[:space:]]/ { exit }
            in_info && /^[[:space:]]+version:[[:space:]]*/ {
              sub(/^[[:space:]]+version:[[:space:]]*/, "")
              gsub(/[[:space:]]+$/, "")
              gsub(/^['\"']|['\"']$/, "")
              print
              exit
            }
          ' openapi.yaml)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "openapi.yaml info.version must be a Semantic Version, got: ${version:-<empty>}" >&2
            exit 1
          fi

          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create tag when it does not already exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "OpenAPI $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          gh release create "$TAG" --title "$TAG" --generate-notes

      - name: Build documentation site
        run: scripts/build-pages.sh public

      - name: Publish documentation site
        env:
          PAGES_REPO_TOKEN: ${{ secrets.PAGES_REPO_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PAGES_REPO_TOKEN" ]]; then
            echo "PAGES_REPO_TOKEN is required to publish mailapi.github.io." >&2
            exit 1
          fi

          git -c http.extraheader="AUTHORIZATION: bearer $PAGES_REPO_TOKEN" \
            clone --depth 1 https://github.com/mailapi/mailapi.github.io.git pages-repository
          rsync --archive --delete --exclude .git public/ pages-repository/

          cd pages-repository
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "Documentation site is already current."
            exit 0
          fi

          git commit --message "Deploy documentation for $TAG"
          git -c http.extraheader="AUTHORIZATION: bearer $PAGES_REPO_TOKEN" \
            push origin HEAD:main
