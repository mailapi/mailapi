<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Interactive reference for the Mail API OpenAPI specification.">
    <title>Mail API reference</title>
    <link rel="stylesheet" href="swagger-ui/swagger-ui.css">
    <style>
      .site-navigation {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 1.25rem;
        justify-content: center;
        padding: 0.8rem 1rem;
        background: #f3f6fa;
        border-bottom: 1px solid #dce6f0;
        font-family: "Open Sans", Arial, sans-serif;
        font-weight: 700;
      }

      .site-navigation a {
        color: #155799;
      }
    </style>
  </head>
  <body>
    <nav class="site-navigation" aria-label="Primary navigation">
      <a href="../">Home</a>
      <a href="./" aria-current="page">API reference</a>
      <a href="../#examples">Examples</a>
      <a href="../#compatibility-assessments">Compatibility</a>
    </nav>
    <div id="swagger-ui"></div>
    <script src="swagger-ui/swagger-ui-bundle.js"></script>
    <script src="swagger-ui/swagger-ui-standalone-preset.js"></script>
    <script>
      window.onload = function () {
        window.ui = SwaggerUIBundle({
          url: "../openapi.yaml",
          dom_id: "#swagger-ui",
          deepLinking: true,
          displayOperationId: true,
          docExpansion: "list",
          supportedSubmitMethods: [],
          validatorUrl: null,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset
          ],
          layout: "StandaloneLayout"
        });
      };
    </script>
  </body>
</html>
